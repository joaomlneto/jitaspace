<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
// The JitaSpace star in 3D: a machined metal plate whose LOW-RESOLUTION render reproduces the
// star in the Caldari Navy corporation logo ("native" below: the 128 px logo, see native.py).
// Served by render3d.py, which prints the URL to open and saves the finished render.
//
// The page builds the star (a shallow lens-shaped face with a bevel down to the outline) and
// then fits, on the native logo's pixel grid:
//   1. the reflection map (matcap), by regularised least squares;
//   2. shallow dents, then tarnish (a colour multiplier on the surface), by back-projection:
//      render, shrink onto the native pixels, push the difference back, repeat;
//   3. a worn-metal slope map and cavities, for the sharp detail the original cannot specify.
// It can also search the shape and where the star sits on the native grid (see `search`).
// The title shows progress and reads "done ..." at the end; window.__result holds the numbers.
//
// URL parameters (render3d.py holds the values behind the committed render):
//   tag               name of the saved files: <tag>-render.png and <tag>-matcap.png
//   size, ppu         height of the saved render in pixels; pixels per logo unit while fitting
//   outline           regular: a regular pentagram, identity mapping onto the native grid
//   g                 JSON, fixed shape and placement: bevel (width), rise (bevel height), dome
//                     (lens height), round (0 chamfer .. 1 quarter-round), in star radii;
//                     s (logo units per native pixel), ox, oy (frame offset in native pixels)
//   search, start, bounds, iters, kshape   the optional shape and placement search
//   m, lambda, cg     reflection map: resolution, smoothness weight, solver iterations
//   dents, dmax, dblur, dgain, deps        dents: rounds, depth limit, blur, gain, probe tilt
//   tarnish, tblur, tmin, tmax, tsat, tpu, gain   tarnish: rounds, blur, limits, how much hue
//                     it may carry, resolution, step size
//   smear             how far tarnish on a bevel is averaged along its edge
//   rugged, tex, wb, wm, wp, ws, seed      surface wear: tilt strength, map size, and the mix
//                     of brushed grain, mottle, pits and scratches
//   cavity, warp      darkening in hollows; organic warp of the fitted patches
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ---- the star's outline and camera
const { OUTLINE, inset, phi, camera } = (() => {
  // Star outline: logo.svg's regular pentagram, outer radius 1, centre at the origin, y up.
  const K = Math.cos(72 * Math.PI / 180) / Math.cos(36 * Math.PI / 180);
  const OUTLINE = [...Array(10)].map((_, i) => {
    const r = i % 2 ? K : 1, a = (90 - 36 * i) * Math.PI / 180;
    return new THREE.Vector2(r * Math.cos(a), r * Math.sin(a));
  });

  // The outline offset inward by d (mitred, so the tips stay sharp). It runs clockwise.
  function inset(pts, d) {
    const n = pts.length, lines = pts.map((a, i) => {
      const b = pts[(i + 1) % n], dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy);
      return { px: a.x + (dy / l) * d, py: a.y - (dx / l) * d, dx, dy };
    });
    return pts.map((_, i) => {
      const L1 = lines[(i + n - 1) % n], L2 = lines[i], det = L1.dx * L2.dy - L1.dy * L2.dx;
      const t = ((L2.px - L1.px) * L2.dy - (L2.py - L1.py) * L2.dx) / det;
      return new THREE.Vector2(L1.px + L1.dx * t, L1.py + L1.dy * t);
    });
  }

  // ---- Inflation height: solve the Poisson equation (laplacian = -1, zero on the outline) on a
  // grid, so the star puffs up smoothly like a pillow: highest at the centre, rounded across each
  // arm, no creases. Computed once; normalised so its maximum is 1.
  const G = 200, EXT = 1.02;
  const insidePoly = (x, y, pts) => {
    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c;
    }
    return c;
  };
  const PHI = (() => {
    const h = (2 * EXT) / (G - 1), u = new Float64Array(G * G), m = new Uint8Array(G * G);
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) m[j * G + i] = insidePoly(-EXT + i * h, -EXT + j * h, OUTLINE);
    for (let it = 0; it < 2500; it++) {            // successive over-relaxation
      for (let j = 1; j < G - 1; j++) for (let i = 1; i < G - 1; i++) {
        const k = j * G + i; if (!m[k]) continue;
        const v = 0.25 * (u[k - 1] + u[k + 1] + u[k - G] + u[k + G] + h * h);
        u[k] += 1.9 * (v - u[k]);
      }
    }
    let mx = 0; for (const v of u) mx = Math.max(mx, v);
    for (let k = 0; k < u.length; k++) u[k] /= mx;
    return { u, h };
  })();
  function phi(x, y) {
    const fx = (x + EXT) / PHI.h, fy = (y + EXT) / PHI.h;
    const i = Math.min(G - 2, Math.max(0, Math.floor(fx))), j = Math.min(G - 2, Math.max(0, Math.floor(fy)));
    const tx = fx - i, ty = fy - j, U = PHI.u;
    return (U[j * G + i] * (1 - tx) + U[j * G + i + 1] * tx) * (1 - ty) + (U[(j + 1) * G + i] * (1 - tx) + U[(j + 1) * G + i + 1] * tx) * ty;
  }

  /** Frame logo.svg's 176 x 168 view (star centre 88, 93.58; radius 88.92) through a perspective camera. */
  function camera(fov = 28) {
    const R = 88.92, f = { l: -88 / R, r: 88 / R, t: 93.58 / R, b: -(168 - 93.58) / R };
    const D = ((f.t - f.b) / 2) / Math.tan(fov * Math.PI / 360);
    const cam = new THREE.PerspectiveCamera();
    cam.position.set(0, 0, D);
    const near = 0.1, k = near / D;
    cam.projectionMatrix.makePerspective(f.l * k, f.r * k, f.t * k, f.b * k, near, D + 10);
    cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
    return cam;
  }
  return { OUTLINE, inset, phi, camera };
})();

// ---- the star's geometry
const { starGeometry3: starGeometry2, DEFAULTS3: DEFAULTS2 } = (() => {
  // A machined star: a shallow lens-shaped face (one broad dome over the whole star, not a
  // pillow per arm) with a chamfered or rounded bevel down to the outline, and a side wall.

  const DEFAULTS3 = { bevel: 0.05, rise: 0.035, dome: 0.12, pillow: 0.0, round: 0.3 };

  /** P.bevel: bevel width; P.rise: bevel height; P.dome: lens height; P.pillow: per-arm puff; P.round: 0 chamfer .. 1 quarter-round. */
  function starGeometry3(P, n = 28, m = 14) {
    const OL = P.outline ?? OUTLINE;   // P.outline: another ten-corner star outline (clockwise, same units)
    const inner = inset(OL, P.bevel);
    const zAt = (x, y) => P.rise + P.dome * (1 - (x * x + y * y)) + P.pillow * Math.sqrt(Math.max(0, phi(x, y)));
    const pos = [], uv = [];
    for (let i = 0; i < 10; i++) {
      const A = inner[i], B = inner[(i + 1) % 10];
      const q = (a, b) => { const u = a / n, v = b / n, x = u * A.x + v * B.x, y = u * A.y + v * B.y; return [x, y, zAt(x, y)]; };
      for (let a = 0; a < n; a++) for (let b = 0; b < n - a; b++) {
        for (const v of [q(a, b), q(a, b + 1), q(a + 1, b)]) { pos.push(...v); uv.push(v[0], v[1]); }
        if (a + b < n - 1) for (const v of [q(a + 1, b), q(a, b + 1), q(a + 1, b + 1)]) { pos.push(...v); uv.push(v[0], v[1]); }
      }
    }
    let face = new THREE.BufferGeometry();
    face.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    face.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    face.setAttribute('guv', new THREE.Float32BufferAttribute(uv, 2));                       // the face is brushed along x
    face.setAttribute('gdir', new THREE.Float32BufferAttribute(Array.from({ length: uv.length / 2 * 3 }, (_, k) => (k % 3 === 0 ? 1 : 0)), 3));
    face = mergeVertices(face, 1e-5);
    face.computeVertexNormals();

    // Bevel: one smooth strip per edge (creased against its neighbours and against the face).
    // Profile across the bevel (0 at the outline, 1 where it meets the face): a chamfer that eases
    // into the face over its last third (no razor crease), mixed with a quarter-round.
    const FI = 0.34, ramp = (u) => (u < 1 - FI ? u : u - (u - (1 - FI)) ** 2 / (2 * FI)) / (1 - FI / 2);
    const prof = (u) => (1 - P.round) * ramp(u) + P.round * Math.sqrt(1 - (1 - u) ** 2);
    const strips = [];
    for (let i = 0; i < 10; i++) {
      const j = (i + 1) % 10, p = [], t2 = [], idx = [], gu = [], gd = [];
      // each bevel is machined along its own edge: grain coordinates run along and across it
      const el = Math.hypot(OL[j].x - OL[i].x, OL[j].y - OL[i].y), ex = (OL[j].x - OL[i].x) / el, ey = (OL[j].y - OL[i].y) / el;
      for (let k = 0; k <= n; k++) for (let s = 0; s <= m; s++) {
        const t = k / n, u = s / m;
        const ox = OL[i].x + (OL[j].x - OL[i].x) * t, oy = OL[i].y + (OL[j].y - OL[i].y) * t;
        const ix = inner[i].x + (inner[j].x - inner[i].x) * t, iy = inner[i].y + (inner[j].y - inner[i].y) * t;
        const x = ox + (ix - ox) * u, y = oy + (iy - oy) * u;
        p.push(x, y, zAt(ix, iy) * prof(u)); t2.push(x, y);
        gu.push(x * ex + y * ey + 0.37 * i, -x * ey + y * ex + 0.61 * i); gd.push(ex, ey, 1);
      }
      const at = (k, s) => k * (m + 1) + s;
      for (let k = 0; k < n; k++) for (let s = 0; s < m; s++) {
        const a = at(k, s), b = at(k, s + 1), c = at(k + 1, s), d = at(k + 1, s + 1);
        idx.push(a, d, c, a, b, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(t2, 2));
      g.setAttribute('guv', new THREE.Float32BufferAttribute(gu, 2)); g.setAttribute('gdir', new THREE.Float32BufferAttribute(gd, 3));
      g.setIndex(idx); g.computeVertexNormals();
      strips.push(g.toNonIndexed());
      // side wall under this edge
      const O1 = OL[i], O2 = OL[j], w = new THREE.BufferGeometry();
      w.setAttribute('position', new THREE.Float32BufferAttribute([O1.x, O1.y, 0, O2.x, O2.y, 0, O2.x, O2.y, -0.05, O1.x, O1.y, 0, O2.x, O2.y, -0.05, O1.x, O1.y, -0.05], 3));
      w.setAttribute('uv', new THREE.Float32BufferAttribute([O1.x, O1.y, O2.x, O2.y, O2.x, O2.y, O1.x, O1.y, O2.x, O2.y, O1.x, O1.y], 2));
      w.setAttribute('guv', w.getAttribute('uv').clone()); w.setAttribute('gdir', new THREE.Float32BufferAttribute([1, 0, 1, 1, 0, 1, 1, 0, 1, 1, 0, 1, 1, 0, 1, 1, 0, 1], 3));
      w.computeVertexNormals(); strips.push(w);
    }
    return { face, bevel: mergeGeometries(strips) };
  }
  return { starGeometry3, DEFAULTS3 };
})();

// ---- the worn-metal surface
const { ruggedSlopeMap } = (() => {
  // Worn metal as a slope map (how far the surface tilts, in x and y), built from four layers that
  // are each normalised to a peak tilt of 1 and then mixed: brushed grain, gentle unevenness,
  // pits and dents, and a few scratches. Everything is drawn anti-aliased. Deterministic per seed.

  function ruggedSlopeMap({ seed = 7, N = 2048, brushed = 1, mottle = 1, pits = 1, scratches = 1 } = {}) {
    let s = seed >>> 0 || 1;
    const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    const NN = N * N, idx = (x, y) => ((y + N) % N) * N + ((x + N) % N);
    const slopes = (h, mode) => {            // central differences, normalised to a peak of about 1
      const dx = new Float32Array(NN), dy = new Float32Array(NN); let m = 0, ss = 0;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const k = y * N + x, a = (h[idx(x + 1, y)] - h[idx(x - 1, y)]) * 0.5, b = (h[idx(x, y + 1)] - h[idx(x, y - 1)]) * 0.5;
        dx[k] = a; dy[k] = b; m = Math.max(m, Math.abs(a), Math.abs(b)); ss += a * a + b * b;
      }
      const norm = mode === 'peak' ? m : 3 * Math.sqrt(ss / (2 * NN));
      for (let k = 0; k < NN; k++) { dx[k] /= norm; dy[k] /= norm; }
      return [dx, dy];
    };
    const boxX = (a, L) => {                 // running-sum box blur along x, wrapping
      const o = new Float32Array(NN);
      for (let y = 0; y < N; y++) { let sum = 0; for (let x = -L; x <= L; x++) sum += a[idx(x, y)]; for (let x = 0; x < N; x++) { o[y * N + x] = sum / (2 * L + 1); sum += a[idx(x + L + 1, y)] - a[idx(x - L, y)]; } }
      return o;
    };
    const blurY = (a) => { const o = new Float32Array(NN); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) o[y * N + x] = 0.25 * a[idx(x, y - 1)] + 0.5 * a[y * N + x] + 0.25 * a[idx(x, y + 1)]; return o; };
    const F = [new Float32Array(NN), new Float32Array(NN)], cav = new Float32Array(NN);
    const dig = (h, w) => { let m = 1e-9; for (let k = 0; k < NN; k++) m = Math.max(m, -h[k]); for (let k = 0; k < NN; k++) cav[k] += w * Math.max(0, -h[k]) / m; };
    const mix = (h, w, mode) => { if (!w) return; const [dx, dy] = slopes(h, mode); for (let k = 0; k < NN; k++) { F[0][k] += w * dx[k]; F[1][k] += w * dy[k]; } };

    if (brushed) {
      // Streaks along x in three widths. Each width is mixed by its own slope, so the finest lines
      // do not swamp the rest (mixing heights instead gives a one-pixel pitch that reads as scanlines).
      const boxY = (a, L) => {
        const o = new Float32Array(NN);
        for (let x = 0; x < N; x++) { let sum = 0; for (let y = -L; y <= L; y++) sum += a[idx(x, y)]; for (let y = 0; y < N; y++) { o[y * N + x] = sum / (2 * L + 1); sum += a[idx(x, y + L + 1)] - a[idx(x, y - L)]; } }
        return o;
      };
      // how strongly an area is brushed varies slowly
      const G = 7, g = Float32Array.from({ length: G * G }, () => rnd()), sm = (t) => t * t * (3 - 2 * t), mod = new Float32Array(NN);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const fx = x / N * G, fy = y / N * G, ix = Math.floor(fx), iy = Math.floor(fy), tx = sm(fx - ix), ty = sm(fy - iy);
        const v = (i, j) => g[((iy + j) % G) * G + (ix + i) % G];
        mod[y * N + x] = 0.45 + 0.75 * ((v(0, 0) * (1 - tx) + v(1, 0) * tx) * (1 - ty) + (v(0, 1) * (1 - tx) + v(1, 1) * tx) * ty);
      }
      const S = N / 3072;       // widths are set for a 3072 texture
      for (const [len, wide, w] of [[150, 4, 1], [70, 2, 0.75], [30, 1, 0.45], [14, 0, 0.18]]) {
        let a = new Float32Array(NN); for (let k = 0; k < NN; k++) a[k] = rnd() - 0.5;
        for (let p = 0; p < 3; p++) a = boxX(a, Math.max(2, Math.round(len * S)));
        if (wide) { const L = Math.max(1, Math.round(wide * S)); for (let p = 0; p < 3; p++) a = boxY(a, L); } else a = blurY(a);
        for (let k = 0; k < NN; k++) a[k] *= mod[k];
        mix(a, brushed * w, 'rms');
      }
    }
    if (mottle) {                            // smooth unevenness at three scales, equal slope each
      const h = new Float32Array(NN);
      for (const cell of [20, 56, 160]) {
        const G = Math.round(N / cell), g = Float32Array.from({ length: G * G }, () => rnd() - 0.5), sm = (t) => t * t * (3 - 2 * t);
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const fx = x / N * G, fy = y / N * G, ix = Math.floor(fx), iy = Math.floor(fy), tx = sm(fx - ix), ty = sm(fy - iy);
          const v = (i, j) => g[((iy + j) % G) * G + (ix + i) % G];
          h[y * N + x] += cell * ((v(0, 0) * (1 - tx) + v(1, 0) * tx) * (1 - ty) + (v(0, 1) * (1 - tx) + v(1, 1) * tx) * ty);
        }
      }
      mix(h, mottle, 'rms');
    }
    const splat = (h, cx, cy, sig, d) => { const r = Math.ceil(3 * sig); for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) h[idx(Math.round(cx) + x, Math.round(cy) + y)] += d * Math.exp(-((x + Math.round(cx) - cx) ** 2 + (y + Math.round(cy) - cy) ** 2) / (2 * sig * sig)); };
    if (pits) {
      const h = new Float32Array(NN);
      for (let i = 0; i < 900; i++) { const sig = 1.5 + rnd() * rnd() * 7; splat(h, rnd() * N, rnd() * N, sig, -sig * (0.4 + rnd())); }
      for (let i = 0; i < 40; i++) { const sig = 10 + rnd() * 22; splat(h, rnd() * N, rnd() * N, sig, -sig * (0.15 + 0.3 * rnd())); }
      mix(h, pits, 'peak'); dig(h, Math.min(1, pits));
    }
    if (scratches) {
      const h = new Float32Array(NN);
      for (let i = 0; i < 70; i++) {
        const x0 = rnd() * N, y0 = rnd() * N, ang = rnd() * Math.PI, len = 60 + rnd() * rnd() * 700, sig = 0.9 + rnd() * 0.9, d = -(0.3 + rnd());
        const bend = (rnd() - 0.5) * 0.0015;
        for (let t = 0; t < len; t += 0.5) { const a = ang + bend * t; splat(h, x0 + Math.cos(a) * t, y0 + Math.sin(a) * t, sig, d * Math.sin(Math.PI * t / len) ** 0.5 * 0.5); }
      }
      mix(h, scratches, 'peak'); dig(h, Math.min(1, scratches));
    }
    let m = 1e-9; for (let k = 0; k < NN; k++) m = Math.max(m, Math.abs(F[0][k]), Math.abs(F[1][k]));
    const data = new Uint8Array(NN * 4);
    for (let k = 0; k < NN; k++) { data[k * 4] = Math.round((F[0][k] / m * 0.5 + 0.5) * 255); data[k * 4 + 1] = Math.round((F[1][k] / m * 0.5 + 0.5) * 255); data[k * 4 + 2] = Math.round(Math.min(1, cav[k]) * 255); data[k * 4 + 3] = 255; }
    const tex = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.NoColorSpace;
    tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true; tex.anisotropy = 8;
    tex.needsUpdate = true; tex.userData.scale = m;    // multiply the stored value by this to get the mixed tilt
    return tex;
  }
  return { ruggedSlopeMap };
})();

// ---- fitting and rendering

const q = new URLSearchParams(location.search), num = (k, d) => +(q.get(k) ?? d);
const TAG = q.get('tag') ?? 'n', M = num('m', 128), LAMBDA = num('lambda', 0.05), CGN = num('cg', 250);
const RUG = num('rugged', 0), CAV = num('cavity', 0), ITERS = num('iters', 0), OUT_H = num('size', 1344), SEED = num('seed', 7);
const FIX = JSON.parse(q.get('g') ?? '{}'), COV = num('cov', 0.15);
const PPU = num('ppu', 8), W = 176 * PPU, H = 168 * PPU, NW = 128;
const TPU = num('tpu', 1), TW = 176 * TPU, TH = 168 * TPU, TARN_IT = num('tarnish', 0), TSIG = num('tblur', 1.6);
const DENT_IT = num('dents', 0), DMAX = num('dmax', 0.06), DSIG = num('dblur', 2), DGAIN = num('dgain', 0.6), DEPS = num('deps', 150);
const GAIN = num('gain', 0.7), BORDER = num('border', 0), WARP = num('warp', 0), TMIN = num('tmin', 0.3), TMAX = num('tmax', 2), TSAT = num('tsat', 1);
const tick = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = r; c.port2.postMessage(0); });

const nImg = await createImageBitmap(await (await fetch('native-128.png')).blob(), { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
const nc = new OffscreenCanvas(NW, NW); const nctx = nc.getContext('2d'); nctx.drawImage(nImg, 0, 0);
const NAT = nctx.getImageData(0, 0, NW, NW).data;

// ---- symmetric star (logo units) -> the lopsided source star -> native pixel
const CX = 88, CY = 93.58, R = 88.92, KK = Math.cos(72 * Math.PI / 180) / Math.cos(36 * Math.PI / 180);
const STAR = [...Array(10)].map((_, i) => { const r = R * (i % 2 ? KK : 1), a = (-90 + 36 * i) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; });
const SRC = [[88, 5], [109.5, 64.75], [172.2, 65.8], [121.3, 105.5], [139.4, 166], [88, 128.5], [35.8, 163.5], [53.9, 105.8], [4.3, 66.2], [66.6, 64.75]], SC = [87.90, 93.58];
const SECT = STAR.map((_, i) => {
  const a = [STAR[i][0] - CX, STAR[i][1] - CY], b = [STAR[(i + 1) % 10][0] - CX, STAR[(i + 1) % 10][1] - CY];
  return { a, b, det: a[0] * b[1] - a[1] * b[0], A: [SRC[i][0] - SC[0], SRC[i][1] - SC[1]], B: [SRC[(i + 1) % 10][0] - SC[0], SRC[(i + 1) % 10][1] - SC[1]] };
});
// source coordinates of every render pixel (fixed), then the native pixel for a given alignment
// outline=native: the star is built with the original's own (slightly lopsided) outline, so a render
// pixel's logo position IS its source position and no warp is needed
