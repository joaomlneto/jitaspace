name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Reads the repository and runs ESLint. No write access required.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # apps/web validates its env vars at import time; CI has no real secrets.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.11
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The only peer-dependency gate. A frozen install skips resolution, so a
      # lockfile with unmet peers installs with exit 0 even though
      # strictPeerDependencies is true — and `pnpm add`/`pnpm update` write
      # such a lockfile with only a warning. This fails on any unmet or missing
      # peer in the committed lockfile.
      - name: Check peer dependencies
        run: pnpm peers check
      # The turbo `lint` task depends on the Prisma and Kubb generators, so a
      # clean checkout produces them itself. `pnpm lint` also runs
      # `manypkg check`, which fails on a dependency declared at different
      # versions across workspaces.
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
