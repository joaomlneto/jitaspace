name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Reads the repository and runs ESLint. No write access required.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # apps/web validates its env vars at import time; CI has no real secrets.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The turbo `lint` task depends on the Prisma and Kubb generators, so a
      # clean checkout produces them itself. `pnpm lint` also runs
      # `manypkg check`, which fails on a dependency declared at different
      # versions across workspaces.
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
