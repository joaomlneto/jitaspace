name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# This job only reads the repository — it checks out the code and runs `tsc`.
# Narrowing the token here rather than inheriting the repository default.
permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # apps/web validates its env vars at import time; CI has no real secrets.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No explicit codegen step: the Prisma client and the Kubb API clients are
      # generated and gitignored, and the turbo `type-check` task declares
      # db:generate/^db:generate and kubb:generate/^kubb:generate, so it produces
      # both itself on a clean checkout. (Before `^kubb:generate` was added, only
      # a package's OWN kubb task was ordered and this held by accident, via the
      # postinstall hooks in the generated-client packages.)
      - name: Type-check
        run: pnpm type-check
