name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Checks out the repo, runs tests and uploads coverage. No write access needed.
permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repository secrets are not exposed to pull_request runs from forks, so the
    # scan step cannot authenticate there. Skip the job rather than spend several
    # minutes of runner time on tests and then fail on missing auth.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      SKIP_ENV_VALIDATION: "1"
      # Dummy DATABASE_URL so prisma generate (postinstall) succeeds
      DATABASE_URL: "postgresql://root@localhost:26257/jitaspace?sslmode=disable"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Disable shallow clone so SonarCloud gets full blame/history data
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.11
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
