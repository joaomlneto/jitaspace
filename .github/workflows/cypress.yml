name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# This job checks out the repo, builds it and runs Cypress. It needs no write
# access; the default token is otherwise handed to a third-party action below.
permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs tests in parallel with matrix strategy https://docs.cypress.io/guides/guides/parallelization
    # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
    # Also see warning here https://github.com/cypress-io/github-action#parallel
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }} # Turborepo caching
      TURBO_TEAM: ${{ vars.TURBO_TEAM }} # Turborepo caching
      # Skip runtime env validation in Next.js during CI runs where secrets are not available
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: "postgresql://root@localhost:26257/jitaspace?sslmode=disable"
      REDIS_URL: "redis://localhost:6379"
    strategy:
      fail-fast: false # https://github.com/cypress-io/github-action/issues/48
      matrix:
        containers: [1, 2] # Uses 2 parallel instances
    steps:
      - name: Start CockroachDB
        run: |
          docker run -d \
            --name cockroachdb \
            -p 26257:26257 \
            -p 8080:8080 \
            cockroachdb/cockroach:v24.3.7 \
            start-single-node --insecure --store=type=mem,size=0.5
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health?ready=1; do sleep 1; done'
          docker exec cockroachdb cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS jitaspace;"
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      # Restored BEFORE install: cypress's postinstall downloads the binary, so
      # a cache restored afterwards never saved the fetch it exists to avoid.
      # Keyed on the lockfile, which carries the resolved version — the previous
      # key hashed apps/web/package.json, whose caret range does not change when
      # a `pnpm update` resolves a new cypress.
      - name: Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Skip the postinstall download; the step below handles it, and on a
          # cache hit no download is needed at all.
          CYPRESS_INSTALL_BINARY: "0"
      - name: Install Cypress binary
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        run: pnpm exec cypress install
      - name: Push database schema
        run: cd packages/db && pnpm exec prisma db push
      - name: Build
        run: pnpm build
      - name: Cypress run
        # Uses the official Cypress GitHub action https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7.3.0
        with:
          # Dependencies are already installed at monorepo root; skip action-level install
          # to avoid lockfile lookup in apps/web (pnpm lockfile is at repository root).
          install: false
          # Run commands from the web app workspace so `pnpm start` resolves to `apps/web`
          working-directory: apps/web
          # Starts web server for E2E tests - the web package exposes `start` which runs Next.js
          start: pnpm start
          wait-on: "http://localhost:3000" # Waits for above
          # Recording requires CYPRESS_RECORD_KEY, and --parallel requires
          # --record. Secrets are not exposed to pull_request runs from forks, so
          # hardcoding these fails the job before a single spec executes. Gate
          # both on the key actually being present; without it the suite still
          # runs, just unrecorded and unsplit.
          # https://docs.cypress.io/guides/cloud/projects#Set-up-a-project-to-record
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
          parallel: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        env:
          # If you enable recording/parallelization set CYPRESS_RECORD_KEY in repo secrets
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
