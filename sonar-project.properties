sonar.organization=joaomlneto

# Heap for SonarJS's Node "bridge" process. Widening sonar.sources below pushed
# the analysed set past ~1350 files, and any change to this file invalidates the
# analysis cache — so the next run re-analyses everything at once instead of the
# few files a PR touched, and the bridge died with "unresponsive ... not enough
# memory". Runs between the widening and that one survived only on a warm cache,
# which is not a property worth relying on.
#
# Sized against the runner rather than guessed: ubuntu-latest reports 15992 MB,
# and the analysis provably exhausts 4288 MB ("heap size limit 4288 MB"), so 4096
# was too conservative. 8192 leaves ample headroom for the JVM scanner alongside.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/languages/javascript-typescript-css/
sonar.javascript.node.maxspace=8192

# Analyse the whole web app, not just app/ + components/. Listing only those two
# left apps/web/lib — serverAuth.ts, eveSsoToken.ts, eveOnlineLogin.ts and the
# history readers, i.e. the app's most security-sensitive server code — entirely
# unindexed: no rules ran there and its changes could never be "new code", so the
# quality gate silently did not apply to it (its lcov data was dropped, since
# Sonar ignores coverage for files it has not indexed). hooks/, layouts/, config/
# and themes/ were invisible for the same reason. Let sonar.exclusions below do
# the pruning instead.
sonar.sources=apps/web,packages
# Widening sonar.sources pulls in three things that are not production code and
# would otherwise be analysed as if they were:
#   `**/cypress/**` +  the e2e specs are still the stock Cypress example scaffold
#   `**/*.cy.ts(x)`    and are not `*.test.*`/`*.spec.*`. Both patterns are
#                      needed: components/Button/TypeButton.cy.tsx is a component
#                      spec living next to its component, not under cypress/.
#                      Mirrors all three exclude entries in apps/web/tsconfig.json.
#   `**/__mocks__/**`  hand-written Jest doubles (the @jitaspace/* stubs).
#   the tooling configs (cypress/eslint/postcss), alongside the jest/env/kubb
#   ones already listed. `next.config.mjs` stays INDEXED — it carries the CSP,
#   security headers and redirects, which are worth running rules over — but it
#   is listed under sonar.coverage.exclusions below, since it is not unit-tested.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/generated/**,**/*.generated.ts,**/coverage/**,**/cypress/**,**/*.cy.ts,**/*.cy.tsx,**/__mocks__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/jest.config.ts,**/jest.setup.ts,**/env.ts,**/kubb.config.ts,**/cypress.config.ts,**/eslint.config.ts,**/postcss.config.cjs,**/scripts/generate-scopes.ts

sonar.tests=apps/web,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# IO-bound / platform-glue code that isn't unit-tested by design: the EVE
# scrapers + Bull/Redis/Discord/Prisma singletons, the Trigger.dev adapter
# (which needs a platform runtime to exercise), the sde-utils network/IO +
# barrel files, the Next.js instrumentation entrypoints (Sentry/PostHog/BotID
# bootstrap — including the sentry.{server,edge}.config.ts files instrumentation.ts
# dynamically imports, which are bare top-level Sentry.init side effects no test
# can cover — and the kubb
# plugin that reads the spec off disk and hands files to kubb's writer. The pure
# logic stays measured — including sde-utils' zip.ts/sources/sde.ts,
# background-jobs' utils/updateTable.ts, the multi hook codegen's decision logic
# in kubb/multiEsiEndpoints.ts, and all of apps/web/lib.
sonar.coverage.exclusions=\
  packages/sde-utils/src/download.ts,\
  packages/sde-utils/src/sde.ts,\
  packages/sde-utils/src/constants.ts,\
  packages/sde-utils/src/index.ts,\
  packages/background-jobs/jobs/**,\
  packages/background-jobs/helpers/**,\
  packages/background-jobs/db.ts,\
  packages/background-jobs/kv.ts,\
  packages/background-jobs/chat.ts,\
  packages/background-jobs/env.ts,\
  packages/background-jobs/config.ts,\
  packages/background-jobs/utils/downloadFile.ts,\
  packages/background-jobs-triggerdev/**,\
  apps/web/components/Status/TriggerJobsDashboard.tsx,\
  apps/web/app/status/actions.ts,\
  apps/web/instrumentation.ts,\
  apps/web/instrumentation-client.ts,\
  apps/web/config/sentry.server.config.ts,\
  apps/web/config/sentry.edge.config.ts,\
  apps/web/next.config.mjs,\
  apps/web/scripts/**,\
  packages/db-history/index.ts,\
  packages/hooks/kubb/pluginMultiEsiQuery.ts

# The per-entity scrapers and the platform adapter / dashboard are
# intentionally repetitive, so exclude them from duplication analysis.
sonar.cpd.exclusions=\
  packages/background-jobs/jobs/**,\
  packages/background-jobs-triggerdev/**,\
  apps/web/components/Status/TriggerJobsDashboard.tsx,\
  apps/web/lib/triggerStatus.ts

sonar.javascript.lcov.reportPaths=\
  apps/web/coverage/lcov.info,\
  packages/auth/coverage/lcov.info,\
  packages/auth-utils/coverage/lcov.info,\
  packages/background-jobs/coverage/lcov.info,\
  packages/chat/coverage/lcov.info,\
  packages/esi-client/coverage/lcov.info,\
  packages/esi-metadata/coverage/lcov.info,\
  packages/eve-components/coverage/lcov.info,\
  packages/eve-data/coverage/lcov.info,\
  packages/hooks/coverage/lcov.info,\
  packages/datatable-tanstack/coverage/lcov.info,\
  packages/datatable-mantine/coverage/lcov.info,\
  packages/sde-utils/coverage/lcov.info,\
  packages/tiptap-eve/coverage/lcov.info,\
  packages/ui/coverage/lcov.info,\
  packages/utils/coverage/lcov.info

# AXIOS_BASE / AXIOS_HEADERS are optional build-time-injected globals. The
# `typeof X === "undefined"` guards in the esi-client are load-bearing: a direct
# `X === undefined` comparison throws a ReferenceError when the global is not
# injected. typescript:S7741 (prefer direct undefined comparison) is therefore a
# false positive on this file.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7741
sonar.issue.ignore.multicriteria.e1.resourceKey=packages/esi-client/src/client.ts

# javascript:S4036 (OS command searched in PATH) on next.config.mjs. The single
# `execSync` there runs `git show -s --format=%cI HEAD` at BUILD time to derive a
# deterministic "last modified" date, on the developer's own machine or the
# Vercel/GitHub builder. There is no request path and no user-controlled input;
# an attacker able to plant a `git` earlier in the builder's PATH already
# controls the build. Hard-coding an absolute path is not portable across macOS,
# the CI image and Vercel's build container, so accept the finding instead.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/web/next.config.mjs
