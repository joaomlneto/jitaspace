packages:
  - apps/*
  - packages/*
  - tooling/*

overrides:
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3
  "prosemirror-model": "1.25.7"
  "prosemirror-state": "1.4.4"
  "prosemirror-transform": "1.12.0"
  "prosemirror-view": "1.41.8"
  # Load-bearing, and not for the reason it looks like. next declares
  # optionalDependencies.sharp "^0.34.5", which is incompatible with apps/web's
  # "^0.35.3" — so under nodeLinker: hoisted pnpm HOISTS NEXT'S 0.34.5 to the root
  # and nests apps/web's 0.35.3 under apps/web/node_modules. next resolves the root
  # copy, i.e. the vulnerable one, and bumping apps/web alone does not protect the
  # image pipeline. Measured by deleting this override and reinstalling:
  #   ./node_modules/sharp            -> 0.34.5   (what next loads)
  #   ./apps/web/node_modules/sharp   -> 0.35.3
  # With it: one copy at 0.35.3, zero sharp@0.34 entries in the lockfile.
  # Covers GHSA-f88m-g3jw-g9cj (libvips memory safety).
  # Caret, not an exact pin: an override replaces the importer's own specifier
  # outright, so pinning here would freeze the patch level this exists to raise
  # and a later manifest bump would install nothing.
  "sharp": "^0.35.3"
nodeLinker: hoisted
publicHoistPattern:
  - "*prisma*"
# On, but it is not the gate. Measured on pnpm 11.3.0, it bites only when
# `pnpm install` has to re-resolve (a specifier edited by hand, a lockfile
# regenerated from scratch): ERR_PNPM_PEER_DEP_ISSUES and exit 1, yet the
# conflicted lockfile is still written. `pnpm add` and `pnpm update` only warn
# and exit 0. An install from a lockfile that already matches package.json
# (`--frozen-lockfile` in every workflow, and the Vercel build) skips
# resolution and never checks peers at all. The gate is the `pnpm peers check`
# step in lint.yml, which fails on the committed lockfile.
# What trips it in practice is Mantine. Every @mantine/* package peers on
# @mantine/core and @mantine/hooks at exactly its own version, so all @mantine/*
# specifiers share one caret floor and move together (Renovate's
# group:allNonMajor bumps them in one PR). `pnpm update @mantine/dates` on its
# own locks a newer dates against the older core, and says so only as a warning.
# Fix a mismatch rather than silencing it. If one ever has to be accepted, scope
# it in `peerDependencyRules` with the reason, and leave this true.
strictPeerDependencies: true
enablePrePostScripts: true
allowBuilds:
  "@depot/cli": false
  "@kubb/cli": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  "@vercel/speed-insights": true
  core-js: false
  cypress: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  turbo: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@jitaspace/db-builds@0.1.0'
  # Published 2026-10-06 19:02 UTC; delete this entry once it is a day old.
  - '@eve-online-tools/eve-ship-tree@0.3.0'
